# ─────────────────────────────────────────────────────────────
# MatrixOS 本地开发基础设施
#   docker compose up -d postgres
#   docker compose down
#   docker compose down -v   # 连同数据卷一起删除
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: matrixos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matrixos
      POSTGRES_PASSWORD: matrixos_dev_only
      POSTGRES_DB: matrixos
      # 中文排序与全文检索
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - matrixos-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrixos -d matrixos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

