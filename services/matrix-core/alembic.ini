# NOTE: This file MUST stay ASCII-only.
# Alembic reads alembic.ini with encoding="locale"; on Windows that is GBK,
# so any non-ASCII bytes here raise UnicodeDecodeError before migration starts.
# Keep comments in English. Chinese documentation lives in README.md.

[alembic]
# Migration scripts directory (relative to this file).
script_location = alembic
# Version file naming: 0001_initial -> readable and ordered.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# Timestamps are UTC everywhere (see app/core/clock.py).
timezone = UTC

# sqlalchemy.url is intentionally empty: the real DSN comes from
# app.core.config.Settings (env var MATRIX_CORE_DATABASE_URL) so that a
# connection string is never committed to the repository.
# Override for one-off runs with: alembic -x db_url=... upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
